# Feature-centric manifest.
#
# Top-level `features:` is keyed by the feature-gate pubkey (base58). SIMD
# metadata (`simd_number`, `simd_url`) is optional — features that ship
# without (or before) a SIMD proposal can still be tested by omitting those
# fields. See README.md for the full schema reference.
#
# `depends_on` and `deprecated_by` reference other feature-gate pubkeys.
# `e2e_checks.<name>.requires.feature_gates` accepts either a raw pubkey or
# a `simd_<N>` alias (resolved via `simd_number`).

